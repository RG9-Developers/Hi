<button onclick="playSound('hiddenpage.html');" style="background-color:black; color:black; border-color:black; font-size:25px;position: fixed; bottom: 0; right: 0; margin: 10px;">button</button>
<script>
    const clickSound = new Audio("click.mp4");

    function playSound(url) {
        clickSound.currentTime = 0; // Reset sound to the start
        clickSound.play();
        
        setTimeout(function() {
            window.location.href = url;
        }, 625);
    }
</script>
